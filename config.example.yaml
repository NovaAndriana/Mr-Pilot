# Konfigurasi MR Pilot.
# Nilai ${NAMA} diambil dari file .env di folder yang sama (diisi otomatis oleh `setup`).
# ${NAMA:-x} = pakai x jika NAMA kosong. Rahasia (token/API key) selalu di .env, jangan di sini.

gitlab:
  url: ${GITLAB_URL:-https://code.idas.id}
  token: ${GITLAB_TOKEN}          # Personal Access Token scope: api
  username: ""                    # kosong = otomatis dari token
  verify_ssl: ${GITLAB_VERIFY_SSL:-true}   # false jika GitLab internal pakai self-signed cert
  poll_interval_seconds: ${GITLAB_POLL_SECONDS:-60}   # cek MR baru tiap 1 menit (min 30)
  skip_draft: true                # MR Draft dilewati; dikirim begitu statusnya Ready
  watch: [reviewer, assignee]     # kirim ke Telegram kalau Anda dijadikan Reviewer ATAU Assignee
  projects: []                    # contoh: ["idas/idas-repo-be"]; kosong = semua project

telegram:
  bot_token: ${TELEGRAM_BOT_TOKEN}
  chat_id: ${TELEGRAM_CHAT_ID}    # chat pribadi Anda dengan bot
  allowed_user_ids: []            # kosong = hanya chat_id di atas yang boleh tap tombol
  proxy: ""                       # isi jika jaringan kantor perlu proxy, mis. http://proxy:8080
  startup_message: true
  api_base: ${TELEGRAM_API_BASE:-https://api.telegram.org}   # ganti hanya jika memakai Bot API server sendiri

review:
  # llm          = selalu review pakai API AI
  # bot          = baca komentar bot "AI Code Review" yang sudah ada di MR
  # bot_then_llm = pakai komentar bot kalau sudah ada; kalau belum, langsung review pakai API AI
  #                (menunggu bot hanya jika belum ada provider AI yang siap)
  mode: ${REVIEW_MODE:-bot_then_llm}
  bot:
    usernames: ["system"]         # username akun bot yang posting review di MR
    marker: "AI Code Review"      # atau dikenali dari teks ini di komentar
    wait_minutes: 15
  llm:                            # provider AI diatur di bagian `ai:` di bawah
    max_diff_chars: 120000
    language: Indonesia
    extra_rules: |
      - Perubahan bentuk response API (array jadi object, field null, dsb.) selalu dicatat sebagai breaking change.
      - Query repository tanpa filter dianggap blocker.
  ignore_files: ["*.lock", "go.sum", "package-lock.json", "yarn.lock", "pnpm-lock.yaml",
                 "vendor/*", "*.min.js", "*.snap"]

merge:
  require_pipeline_success: true  # tolak merge jika pipeline belum hijau
  allow_no_pipeline: true
  approve_before_merge: true      # klik "Approve" atas nama Anda sebelum merge
  remove_source_branch: true
  squash: false
  confirm_if_not_approved: true   # minta konfirmasi kedua jika verdict bukan Approve
  confirm_if_quality_errors: true # minta konfirmasi kedua jika ada error standar kode

ai:
  # Provider dicoba sesuai `order`; jika gagal (error/timeout/kuota), otomatis pindah ke berikutnya.
  # enabled: auto = aktif jika API key / login tersedia. Semua bisa diubah juga di dashboard > AI.
  providers:
    claude_code:                  # CLI Claude Code, memakai langganan Pro/Max/Team
      type: claude_code           # token: CLAUDE_CODE_OAUTH_TOKEN (hasil `claude setup-token`)
      model: ${CLAUDE_CODE_MODEL:-sonnet}
    anthropic:
      type: anthropic             # key: ANTHROPIC_API_KEY
      model: ${ANTHROPIC_MODEL:-claude-sonnet-5-5}
    gemini:
      type: gemini                # key: GEMINI_API_KEY
      model: ${GEMINI_MODEL:-gemini-3.8-flash}
    openrouter:
      type: openrouter            # key: OPENROUTER_API_KEY
      model: ${OPENROUTER_MODEL:-anthropic/claude-sonnet-5.5}
    groq:
      type: groq                  # key: GROQ_API_KEY
      model: ${GROQ_MODEL:-openai/gpt-oss-120b}
    openai:
      type: openai                # key: OPENAI_API_KEY; base_url bisa diganti ke gateway OpenAI-compatible
      model: ${OPENAI_MODEL:-gpt-5}
    local:
      type: local                 # Ollama / LM Studio / vLLM (OpenAI-compatible), tanpa key
      enabled: ${LOCAL_AI_ENABLED:-auto}
      base_url: ${LOCAL_AI_URL:-http://localhost:11434/v1}
      model: ${LOCAL_AI_MODEL:-qwen2.5-coder:14b}
  order: ${AI_ORDER:-claude_code,anthropic,gemini,openrouter,groq,openai,local}
  tasks: {}                       # mis. {review: claude_code, standards: groq}
  timeout: 300

code_quality:
  enabled: ${CODE_QUALITY_ENABLED:-true}   # false = fitur standar kode mati
  standards_dir: standards        # tulis standar di sini (atau lewat dashboard > Standar)
  general_document: general.md    # standar umum, berlaku semua stack
  rules_file: rules.yaml          # aturan regex yang dicek di setiap commit
  stacks:                         # stack ditentukan dari path file
    go:
      name: Backend Go
      paths: ["**/*.go"]
      document: go.md
    react:
      name: Frontend React
      paths: ["**/*.ts", "**/*.tsx", "**/*.js", "**/*.jsx"]
      exclude: ["mobile/**", "**/node_modules/**"]
      document: react.md
    react-native:
      name: Mobile React Native
      paths: ["mobile/**/*.ts", "mobile/**/*.tsx"]
      document: react-native.md
  conventions:
    mr_title_pattern: '^(feat|fix|refactor|perf|test|docs|chore|ci|build|revert)(\([A-Z][A-Z0-9]+-\d+\))?!?: .+'
    commit_message_pattern: '^(feat|fix|refactor|perf|test|docs|chore|ci|build|revert)(\(.+\))?!?: .+'
    commit_message_severity: info
    pr_checklist: pr-checklist.md
    require_pr_checklist: warn_unchecked   # off | present | warn_unchecked
  ai_check: true                  # AI membandingkan diff dengan dokumen standar (.md); butuh review.llm.api_key
  ai_min_confidence: high         # hanya temuan AI yang yakin yang dipakai
  report:
    commit_comments: ${COMMIT_COMMENTS:-true}   # warning diposting di COMMIT-nya (file + baris)
    min_severity_to_post: warning # info tidak diposting, hanya tampil di dashboard/Telegram
    max_comments_per_commit: 10
    ai_inline_comments: true      # temuan AI jadi komentar inline di diff MR
    mr_summary_note: true         # satu komentar ringkasan di MR, di-update setiap ada commit baru
    commit_status: true           # status "code-standard" di commit terbaru
    status_name: code-standard
    status_fail_on: none          # none | error | warning. "error" = status merah jika ada error
                                  # (hati-hati: bisa ikut menahan merge jika "pipeline must succeed" aktif)
    comment_footer: "Pengecekan standar kode otomatis"

dashboard:
  enabled: true
  host: ${DASHBOARD_HOST:-127.0.0.1}   # 0.0.0.0 agar bisa dibuka dari HP/laptop lain (otomatis di Docker)
  port: ${DASHBOARD_PORT:-8787}
  password: ${DASHBOARD_PASSWORD} # wajib jika host bukan 127.0.0.1
  public_url: ${DASHBOARD_PUBLIC_URL:-}   # mis. http://pc-nova:8787, dipakai sebagai link di status commit

teams:
  # power_automate = kirim ke grup IDAS via flow Power Automate (tampil sebagai akun Anda)
  # telegram_copy  = teks dikirim ke Telegram, Anda copy-paste sendiri ke Teams
  # off            = tidak kirim apa-apa
  mode: ${TEAMS_MODE:-power_automate}
  webhook_url: ${TEAMS_FLOW_URL}
  # Dipilih acak supaya tidak monoton. Placeholder:
  # {ref} {title} {jira} {topic} {author_first} {author_name} {source_branch} {target_branch} {url} {project}
  templates:
    - "Halo tim, MR {ref} {title} sudah saya merge ke {target_branch}. Thanks {author_first} 🙏"
    - "Info, {topic} dari {author_first} sudah merged ke {target_branch} ya. Silakan dicek, kabari kalau ada isu."
    - "Rekan-rekan, MR {ref} ({topic}) sudah saya merge ke {target_branch}. Makasih {author_first}."
    - "{topic} sudah masuk {target_branch} ya. Thanks {author_first}, mohon dipantau di {target_branch}."

storage:
  db_path: mr_pilot.db
  log_file: logs/mr-pilot.log
